name: Paddle Product Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list-products
          - create-all
          - archive-price
      price_id:
        description: 'Price ID to archive (for archive-price action)'
        required: false
        type: string

jobs:
  paddle-setup:
    runs-on: ubuntu-latest
    steps:
      - name: List existing products
        if: inputs.action == 'list-products'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          echo "=== Listing Paddle Products ==="
          curl -s https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" | python3 -m json.tool

          echo ""
          echo "=== Listing Paddle Prices ==="
          curl -s "https://api.paddle.com/prices?include=product" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: Archive a price
        if: inputs.action == 'archive-price'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          PRICE_ID="${{ inputs.price_id }}"
          if [ -z "$PRICE_ID" ]; then
            echo "ERROR: price_id is required for archive-price action"
            exit 1
          fi
          echo "Archiving price: $PRICE_ID"
          RESULT=$(curl -s -X PATCH "https://api.paddle.com/prices/$PRICE_ID" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "archived"}')
          echo "$RESULT" | python3 -m json.tool

      - uses: actions/checkout@v4
        if: inputs.action == 'create-all'

      - name: Create all products and prices
        if: inputs.action == 'create-all'
        shell: bash {0}
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          echo "=== Starting Paddle Product Creation ==="
          echo "API key length: ${#PADDLE_API_KEY}"
          echo ""

          RESULTS=""
          FAIL=0

          # Helper: create product, return product ID
          paddle_create_product() {
            local json_body
            json_body=$(python3 -c "
          import json, sys
          print(json.dumps({
            'name': sys.argv[1],
            'description': sys.argv[2],
            'tax_category': 'digital-goods',
            'custom_data': {'package_id': sys.argv[3]}
          }))" "$1" "$2" "$3")

            local resp
            resp=$(curl -s -X POST https://api.paddle.com/products \
              -H "Authorization: Bearer ${PADDLE_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "${json_body}")

            python3 -c "
          import json, sys
          try:
            d = json.loads(sys.argv[1])
            pid = d.get('data',{}).get('id','')
            if pid: print(pid)
            else: print('FAIL'); print('Response: '+sys.argv[1], file=sys.stderr)
          except: print('FAIL'); print('Parse error: '+sys.argv[1], file=sys.stderr)
          " "${resp}"
          }

          # Helper: create price, return price ID
          paddle_create_price() {
            local product_id="$1"
            local amount="$2"
            local desc="$3"
            local pkg="$4"

            local json_body
            json_body=$(python3 -c "
          import json, sys
          print(json.dumps({
            'product_id': sys.argv[1],
            'description': sys.argv[2],
            'unit_price': {'amount': sys.argv[3], 'currency_code': 'USD'},
            'custom_data': {'package_id': sys.argv[4]}
          }))" "${product_id}" "${desc}" "${amount}" "${pkg}")

            local resp
            resp=$(curl -s -X POST https://api.paddle.com/prices \
              -H "Authorization: Bearer ${PADDLE_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "${json_body}")

            python3 -c "
          import json, sys
          try:
            d = json.loads(sys.argv[1])
            pid = d.get('data',{}).get('id','')
            if pid: print(pid)
            else: print('FAIL'); print('Response: '+sys.argv[1], file=sys.stderr)
          except: print('FAIL'); print('Parse error: '+sys.argv[1], file=sys.stderr)
          " "${resp}"
          }

          # Test API connectivity
          echo "--- Testing API ---"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.paddle.com/products \
            -H "Authorization: Bearer ${PADDLE_API_KEY}")
          echo "GET /products: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: API returned ${HTTP_CODE}"
            exit 1
          fi
          echo "API OK"
          echo ""

          # 1. TailorPic 1 - product already exists
          echo "--- 1/7: TailorPic 1 (product exists) ---"
          P1_PRICE=$(paddle_create_price "pro_01m68s5dc6aqczq04cw6nfgxk1" "699" "TailorPic 1 - 1 AI headshot" "headshots-tailorpic1")
          echo "  Price: ${P1_PRICE}"
          if [ "${P1_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_HEADSHOTS_TAILORPIC1=${P1_PRICE}\n"

          # 2. Lite
          echo "--- 2/7: Lite ---"
          P2_PROD=$(paddle_create_product "Lite" "5 AI professional headshots" "headshots-lite")
          echo "  Product: ${P2_PROD}"
          if [ "${P2_PROD}" != "FAIL" ]; then
            P2_PRICE=$(paddle_create_price "${P2_PROD}" "990" "Lite - 5 AI headshots" "headshots-lite")
          else
            P2_PRICE="FAIL"
          fi
          echo "  Price: ${P2_PRICE}"
          if [ "${P2_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_HEADSHOTS_LITE=${P2_PRICE}\n"

          # 3. Basic
          echo "--- 3/7: Basic ---"
          P3_PROD=$(paddle_create_product "Basic" "10 AI professional headshots" "headshots-express")
          echo "  Product: ${P3_PROD}"
          if [ "${P3_PROD}" != "FAIL" ]; then
            P3_PRICE=$(paddle_create_price "${P3_PROD}" "1990" "Basic - 10 AI headshots" "headshots-express")
          else
            P3_PRICE="FAIL"
          fi
          echo "  Price: ${P3_PRICE}"
          if [ "${P3_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_HEADSHOTS_EXPRESS=${P3_PRICE}\n"

          # 4. Starter
          echo "--- 4/7: Starter ---"
          P4_PROD=$(paddle_create_product "Starter" "40 AI professional headshots" "headshots-starter")
          echo "  Product: ${P4_PROD}"
          if [ "${P4_PROD}" != "FAIL" ]; then
            P4_PRICE=$(paddle_create_price "${P4_PROD}" "2990" "Starter - 40 AI headshots" "headshots-starter")
          else
            P4_PRICE="FAIL"
          fi
          echo "  Price: ${P4_PRICE}"
          if [ "${P4_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_HEADSHOTS_STARTER=${P4_PRICE}\n"

          # 5. Professional
          echo "--- 5/7: Professional ---"
          P5_PROD=$(paddle_create_product "Professional" "80 AI professional headshots" "headshots-professional")
          echo "  Product: ${P5_PROD}"
          if [ "${P5_PROD}" != "FAIL" ]; then
            P5_PRICE=$(paddle_create_price "${P5_PROD}" "4990" "Professional - 80 AI headshots" "headshots-professional")
          else
            P5_PRICE="FAIL"
          fi
          echo "  Price: ${P5_PRICE}"
          if [ "${P5_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_HEADSHOTS_PROFESSIONAL=${P5_PRICE}\n"

          # 6. Executive
          echo "--- 6/7: Executive ---"
          P6_PROD=$(paddle_create_product "Executive" "160 AI professional headshots" "headshots-executive")
          echo "  Product: ${P6_PROD}"
          if [ "${P6_PROD}" != "FAIL" ]; then
            P6_PRICE=$(paddle_create_price "${P6_PROD}" "8990" "Executive - 160 AI headshots" "headshots-executive")
          else
            P6_PRICE="FAIL"
          fi
          echo "  Price: ${P6_PRICE}"
          if [ "${P6_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_HEADSHOTS_EXECUTIVE=${P6_PRICE}\n"

          # 7. Express Headshot
          echo "--- 7/7: Express Headshot ---"
          P7_PROD=$(paddle_create_product "Express Headshot" "5 instant AI headshots from 1 selfie" "express-instant")
          echo "  Product: ${P7_PROD}"
          if [ "${P7_PROD}" != "FAIL" ]; then
            P7_PRICE=$(paddle_create_price "${P7_PROD}" "1990" "Express Headshot - 5 instant headshots" "express-instant")
          else
            P7_PRICE="FAIL"
          fi
          echo "  Price: ${P7_PRICE}"
          if [ "${P7_PRICE}" = "FAIL" ]; then FAIL=$((FAIL+1)); fi
          RESULTS="${RESULTS}PADDLE_PRICE_EXPRESS_INSTANT=${P7_PRICE}\n"

          # Summary
          echo ""
          echo "========================================"
          echo "  SUMMARY"
          echo "========================================"
          echo -e "${RESULTS}"
          echo "Failed: ${FAIL} / 7"

          # Post as commit comment
          COMMIT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
          if [ -n "${COMMIT_SHA}" ]; then
            COMMENT_BODY=$(echo -e "${RESULTS}Failed: ${FAIL} / 7")
            gh api "repos/$GITHUB_REPOSITORY/commits/${COMMIT_SHA}/comments" \
              -f body="${COMMENT_BODY}" 2>/dev/null || true
          fi

          # Step summary
          if [ -n "${GITHUB_STEP_SUMMARY}" ]; then
            {
              echo "## Paddle Setup Results"
              echo '```'
              echo -e "${RESULTS}"
              echo "Failed: ${FAIL} / 7"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${FAIL}" -gt 0 ]; then
            exit 1
          fi
