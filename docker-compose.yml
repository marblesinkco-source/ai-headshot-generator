# =============================================================================
# TailorPic — Docker Compose
# =============================================================================
#
# Plan 1 (Managed):  docker compose up app
# Plan 2 (Hybrid):   docker compose --profile hybrid up
# Plan 3 (Full):     docker compose --profile full up
#
# Environment variables: copy .env.example → .env and fill in your values.
# =============================================================================

services:
  # ── Next.js Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tailorpic-app
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  # ── PostgreSQL (Plan 2/3 — replaces Supabase) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tailorpic-db
    profiles: ["hybrid", "full"]
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailorpic}
      POSTGRES_USER: ${POSTGRES_USER:-tailorpic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tailorpic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Plan 2/3 — replaces Upstash) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tailorpic-redis
    profiles: ["hybrid", "full"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy (Plan 2/3) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tailorpic-nginx
    profiles: ["hybrid", "full"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ── Backup (Plan 2/3) ───────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: tailorpic-backup
    profiles: ["hybrid", "full"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-tailorpic}
      PGUSER: ${POSTGRES_USER:-tailorpic}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -Fc > /backups/tailorpic-$$(date +%Y%m%d-%H%M%S).dump;
        find /backups -name '*.dump' -mtime +7 -delete;
        sleep 86400;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
