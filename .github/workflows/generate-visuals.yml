name: Generate Site Visuals

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Visual category to generate (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - samples
          - hero
          - before-after
          - category-hero
          - blog-cover
          - style-preview
          - social-og
          - city-hero
      id:
        description: 'Single visual ID to generate (overrides category)'
        required: false
        type: string
      concurrency:
        description: 'Max concurrent API calls'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Dry run (print prompts without generating)'
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate visuals
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.id }}" ]; then
            ARGS="$ARGS --id ${{ inputs.id }}"
          elif [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category ${{ inputs.category }}"
          fi
          ARGS="$ARGS --concurrency ${{ inputs.concurrency || '3' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/generate-site-visuals.ts $ARGS

      - name: Upload artifacts
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-visuals
          path: public/images/generated/
          retention-days: 30

      - name: Commit generated images
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/generated/
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "feat: generate ${COUNT} AI marketing visuals via Flux-dev

            Generated by generate-visuals workflow.
            Category: ${{ inputs.category || 'all' }}
            Model: black-forest-labs/flux-dev"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f public/images/generated/manifest.json ]; then
            echo "### 📸 Visual Generation Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat public/images/generated/manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ No manifest generated (dry run or no visuals)" >> $GITHUB_STEP_SUMMARY
          fi
