name: Paddle Product Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list-products
          - create-all
          - archive-price
      price_id:
        description: 'Price ID to archive (for archive-price action)'
        required: false
        type: string

jobs:
  paddle-setup:
    runs-on: ubuntu-latest
    steps:
      - name: List existing products
        if: inputs.action == 'list-products'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          echo "=== Listing Paddle Products ==="
          curl -s https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" | python3 -m json.tool

          echo ""
          echo "=== Listing Paddle Prices ==="
          curl -s "https://api.paddle.com/prices?include=product" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: Archive a price
        if: inputs.action == 'archive-price'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          PRICE_ID="${{ inputs.price_id }}"
          if [ -z "$PRICE_ID" ]; then
            echo "ERROR: price_id is required for archive-price action"
            exit 1
          fi
          echo "Archiving price: $PRICE_ID"
          RESULT=$(curl -s -X PATCH "https://api.paddle.com/prices/$PRICE_ID" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "archived"}')
          echo "$RESULT" | python3 -m json.tool

      - name: Create all products and prices
        if: inputs.action == 'create-all'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          set -e

          # Helper function to create a product
          create_product() {
            local name="$1"
            local description="$2"
            local custom_data="$3"

            RESULT=$(curl -s -X POST https://api.paddle.com/products \
              -H "Authorization: Bearer $PADDLE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"$name\",
                \"description\": \"$description\",
                \"tax_category\": \"digital-goods\",
                \"custom_data\": $custom_data
              }")

            PRODUCT_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])" 2>/dev/null)
            if [ -z "$PRODUCT_ID" ]; then
              echo "ERROR creating product '$name':"
              echo "$RESULT" | python3 -m json.tool
              return 1
            fi
            echo "$PRODUCT_ID"
          }

          # Helper function to create a one-time price
          create_price() {
            local product_id="$1"
            local amount="$2"
            local description="$3"
            local package_id="$4"

            RESULT=$(curl -s -X POST https://api.paddle.com/prices \
              -H "Authorization: Bearer $PADDLE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"product_id\": \"$product_id\",
                \"description\": \"$description\",
                \"type\": \"standard\",
                \"billing_cycle\": null,
                \"unit_price\": {
                  \"amount\": \"$amount\",
                  \"currency_code\": \"USD\"
                },
                \"custom_data\": {\"package_id\": \"$package_id\"}
              }")

            PRICE_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])" 2>/dev/null)
            if [ -z "$PRICE_ID" ]; then
              echo "ERROR creating price for product $product_id:"
              echo "$RESULT" | python3 -m json.tool
              return 1
            fi
            echo "$PRICE_ID"
          }

          echo "========================================"
          echo "  TailorPic Paddle Product Setup"
          echo "========================================"
          echo ""

          # Track all created IDs
          declare -A PRICE_IDS

          # ---- 1. TailorPic 1 ----
          # Product already exists: pro_01m68s5dc6aqczq04cw6nfgxk1
          # But it has wrong prices. We'll create a correct price on the existing product.
          echo "--- 1/7: TailorPic 1 (using existing product) ---"
          PRICE=$(create_price "pro_01m68s5dc6aqczq04cw6nfgxk1" "699" "TailorPic 1 - 1 AI headshot" "headshots-tailorpic1")
          if [ $? -eq 0 ]; then
            echo "  ✅ Price created: $PRICE ($6.99)"
            PRICE_IDS[HEADSHOTS_TAILORPIC1]="$PRICE"
          else
            echo "  ❌ Failed to create TailorPic 1 price"
          fi
          echo ""

          # ---- 2. Lite ----
          echo "--- 2/7: Lite ---"
          PRODUCT=$(create_product "Lite" "5 AI professional headshots" '{"package_id": "headshots-lite"}')
          if [ $? -eq 0 ]; then
            echo "  Product: $PRODUCT"
            PRICE=$(create_price "$PRODUCT" "990" "Lite - 5 AI headshots" "headshots-lite")
            if [ $? -eq 0 ]; then
              echo "  ✅ Price created: $PRICE ($9.90)"
              PRICE_IDS[HEADSHOTS_LITE]="$PRICE"
            fi
          fi
          echo ""

          # ---- 3. Basic ----
          echo "--- 3/7: Basic ---"
          PRODUCT=$(create_product "Basic" "10 AI professional headshots" '{"package_id": "headshots-express"}')
          if [ $? -eq 0 ]; then
            echo "  Product: $PRODUCT"
            PRICE=$(create_price "$PRODUCT" "1990" "Basic - 10 AI headshots" "headshots-express")
            if [ $? -eq 0 ]; then
              echo "  ✅ Price created: $PRICE ($19.90)"
              PRICE_IDS[HEADSHOTS_EXPRESS]="$PRICE"
            fi
          fi
          echo ""

          # ---- 4. Starter ----
          echo "--- 4/7: Starter ---"
          PRODUCT=$(create_product "Starter" "40 AI professional headshots" '{"package_id": "headshots-starter"}')
          if [ $? -eq 0 ]; then
            echo "  Product: $PRODUCT"
            PRICE=$(create_price "$PRODUCT" "2990" "Starter - 40 AI headshots" "headshots-starter")
            if [ $? -eq 0 ]; then
              echo "  ✅ Price created: $PRICE ($29.90)"
              PRICE_IDS[HEADSHOTS_STARTER]="$PRICE"
            fi
          fi
          echo ""

          # ---- 5. Professional ----
          echo "--- 5/7: Professional ---"
          PRODUCT=$(create_product "Professional" "80 AI professional headshots - recommended" '{"package_id": "headshots-professional"}')
          if [ $? -eq 0 ]; then
            echo "  Product: $PRODUCT"
            PRICE=$(create_price "$PRODUCT" "4990" "Professional - 80 AI headshots" "headshots-professional")
            if [ $? -eq 0 ]; then
              echo "  ✅ Price created: $PRICE ($49.90)"
              PRICE_IDS[HEADSHOTS_PROFESSIONAL]="$PRICE"
            fi
          fi
          echo ""

          # ---- 6. Executive ----
          echo "--- 6/7: Executive ---"
          PRODUCT=$(create_product "Executive" "160 AI professional headshots - premium" '{"package_id": "headshots-executive"}')
          if [ $? -eq 0 ]; then
            echo "  Product: $PRODUCT"
            PRICE=$(create_price "$PRODUCT" "8990" "Executive - 160 AI headshots" "headshots-executive")
            if [ $? -eq 0 ]; then
              echo "  ✅ Price created: $PRICE ($89.90)"
              PRICE_IDS[HEADSHOTS_EXECUTIVE]="$PRICE"
            fi
          fi
          echo ""

          # ---- 7. Express Headshot ----
          echo "--- 7/7: Express Headshot ---"
          PRODUCT=$(create_product "Express Headshot" "5 instant AI headshots from 1 selfie in 15 seconds" '{"package_id": "express-instant"}')
          if [ $? -eq 0 ]; then
            echo "  Product: $PRODUCT"
            PRICE=$(create_price "$PRODUCT" "1990" "Express Headshot - 5 instant AI headshots" "express-instant")
            if [ $? -eq 0 ]; then
              echo "  ✅ Price created: $PRICE ($19.90)"
              PRICE_IDS[EXPRESS_INSTANT]="$PRICE"
            fi
          fi
          echo ""

          # ---- Summary ----
          echo "========================================"
          echo "  SUMMARY — Environment Variables"
          echo "========================================"
          echo ""
          echo "Add these to Vercel Environment Variables:"
          echo ""
          for KEY in HEADSHOTS_TAILORPIC1 HEADSHOTS_LITE HEADSHOTS_EXPRESS HEADSHOTS_STARTER HEADSHOTS_PROFESSIONAL HEADSHOTS_EXECUTIVE EXPRESS_INSTANT; do
            VALUE="${PRICE_IDS[$KEY]}"
            if [ -n "$VALUE" ]; then
              echo "PADDLE_PRICE_$KEY=$VALUE"
            else
              echo "PADDLE_PRICE_$KEY=⚠️ FAILED — create manually"
            fi
          done
          echo ""
          echo "Also add:"
          echo "PADDLE_API_KEY=<your-api-key>"
          echo "PADDLE_WEBHOOK_SECRET=<your-webhook-secret>"
          echo "NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=<your-client-token>"
          echo "NEXT_PUBLIC_PADDLE_ENV=production"
