name: Paddle Product Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list-products
          - create-all
          - archive-price
      price_id:
        description: 'Price ID to archive (for archive-price action)'
        required: false
        type: string

jobs:
  paddle-setup:
    runs-on: ubuntu-latest
    steps:
      - name: List existing products
        if: inputs.action == 'list-products'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          echo "=== Listing Paddle Products ==="
          curl -s https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" | python3 -m json.tool

          echo ""
          echo "=== Listing Paddle Prices ==="
          curl -s "https://api.paddle.com/prices?include=product" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: Archive a price
        if: inputs.action == 'archive-price'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          PRICE_ID="${{ inputs.price_id }}"
          if [ -z "$PRICE_ID" ]; then
            echo "ERROR: price_id is required for archive-price action"
            exit 1
          fi
          echo "Archiving price: $PRICE_ID"
          RESULT=$(curl -s -X PATCH "https://api.paddle.com/prices/$PRICE_ID" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "archived"}')
          echo "$RESULT" | python3 -m json.tool

      - name: Create all products and prices
        if: inputs.action == 'create-all'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          echo "========================================"
          echo "  TailorPic Paddle Product Setup"
          echo "========================================"
          echo ""

          # Check API key is set
          if [ -z "$PADDLE_API_KEY" ]; then
            echo "ERROR: PADDLE_API_KEY secret is not set"
            exit 1
          fi
          echo "API key present: ${PADDLE_API_KEY:0:15}..."

          FAIL_COUNT=0

          # Helper: create product, prints product ID or FAIL
          create_product() {
            local name="$1"
            local description="$2"
            local package_id="$3"

            local PAYLOAD="{\"name\": \"$name\", \"description\": \"$description\", \"tax_category\": \"digital-goods\", \"custom_data\": {\"package_id\": \"$package_id\"}}"
            echo "  Request payload: $PAYLOAD" >&2

            local RESULT
            local HTTP_CODE
            RESULT=$(curl -s -w "\n%{http_code}" -X POST https://api.paddle.com/products \
              -H "Authorization: Bearer $PADDLE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESULT" | tail -1)
            RESULT=$(echo "$RESULT" | sed '$d')
            echo "  HTTP $HTTP_CODE" >&2
            echo "  Response: $RESULT" >&2

            local PRODUCT_ID
            PRODUCT_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
            if [ -n "$PRODUCT_ID" ] && [ "$PRODUCT_ID" != "" ]; then
              echo "$PRODUCT_ID"
            else
              echo "FAIL"
            fi
          }

          # Helper: create price, prints price ID or FAIL
          create_price() {
            local product_id="$1"
            local amount="$2"
            local description="$3"
            local package_id="$4"

            local PAYLOAD="{\"product_id\": \"$product_id\", \"description\": \"$description\", \"unit_price\": {\"amount\": \"$amount\", \"currency_code\": \"USD\"}, \"custom_data\": {\"package_id\": \"$package_id\"}}"
            echo "  Request payload: $PAYLOAD" >&2

            local RESULT
            local HTTP_CODE
            RESULT=$(curl -s -w "\n%{http_code}" -X POST https://api.paddle.com/prices \
              -H "Authorization: Bearer $PADDLE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESULT" | tail -1)
            RESULT=$(echo "$RESULT" | sed '$d')
            echo "  HTTP $HTTP_CODE" >&2
            echo "  Response: $RESULT" >&2

            local PRICE_ID
            PRICE_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
            if [ -n "$PRICE_ID" ] && [ "$PRICE_ID" != "" ]; then
              echo "$PRICE_ID"
            else
              echo "FAIL"
            fi
          }

          # ---- 1. TailorPic 1 (product already exists) ----
          echo "--- 1/7: TailorPic 1 (existing product: pro_01m68s5dc6aqczq04cw6nfgxk1) ---"
          P1_PRICE=$(create_price "pro_01m68s5dc6aqczq04cw6nfgxk1" "699" "TailorPic 1 - 1 AI headshot" "headshots-tailorpic1")
          if [ "$P1_PRICE" != "FAIL" ]; then
            echo "  Price: $P1_PRICE (699 cents = 6.99 USD)"
          else
            echo "  FAILED to create price"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- 2. Lite ----
          echo "--- 2/7: Lite ---"
          P2_PROD=$(create_product "Lite" "5 AI professional headshots" "headshots-lite")
          if [ "$P2_PROD" != "FAIL" ]; then
            echo "  Product: $P2_PROD"
            P2_PRICE=$(create_price "$P2_PROD" "990" "Lite - 5 AI headshots" "headshots-lite")
            if [ "$P2_PRICE" != "FAIL" ]; then
              echo "  Price: $P2_PRICE (990 cents = 9.90 USD)"
            else
              echo "  FAILED to create price"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  FAILED to create product"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- 3. Basic ----
          echo "--- 3/7: Basic ---"
          P3_PROD=$(create_product "Basic" "10 AI professional headshots" "headshots-express")
          if [ "$P3_PROD" != "FAIL" ]; then
            echo "  Product: $P3_PROD"
            P3_PRICE=$(create_price "$P3_PROD" "1990" "Basic - 10 AI headshots" "headshots-express")
            if [ "$P3_PRICE" != "FAIL" ]; then
              echo "  Price: $P3_PRICE (1990 cents = 19.90 USD)"
            else
              echo "  FAILED to create price"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  FAILED to create product"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- 4. Starter ----
          echo "--- 4/7: Starter ---"
          P4_PROD=$(create_product "Starter" "40 AI professional headshots" "headshots-starter")
          if [ "$P4_PROD" != "FAIL" ]; then
            echo "  Product: $P4_PROD"
            P4_PRICE=$(create_price "$P4_PROD" "2990" "Starter - 40 AI headshots" "headshots-starter")
            if [ "$P4_PRICE" != "FAIL" ]; then
              echo "  Price: $P4_PRICE (2990 cents = 29.90 USD)"
            else
              echo "  FAILED to create price"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  FAILED to create product"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- 5. Professional ----
          echo "--- 5/7: Professional ---"
          P5_PROD=$(create_product "Professional" "80 AI professional headshots - recommended" "headshots-professional")
          if [ "$P5_PROD" != "FAIL" ]; then
            echo "  Product: $P5_PROD"
            P5_PRICE=$(create_price "$P5_PROD" "4990" "Professional - 80 AI headshots" "headshots-professional")
            if [ "$P5_PRICE" != "FAIL" ]; then
              echo "  Price: $P5_PRICE (4990 cents = 49.90 USD)"
            else
              echo "  FAILED to create price"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  FAILED to create product"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- 6. Executive ----
          echo "--- 6/7: Executive ---"
          P6_PROD=$(create_product "Executive" "160 AI professional headshots - premium" "headshots-executive")
          if [ "$P6_PROD" != "FAIL" ]; then
            echo "  Product: $P6_PROD"
            P6_PRICE=$(create_price "$P6_PROD" "8990" "Executive - 160 AI headshots" "headshots-executive")
            if [ "$P6_PRICE" != "FAIL" ]; then
              echo "  Price: $P6_PRICE (8990 cents = 89.90 USD)"
            else
              echo "  FAILED to create price"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  FAILED to create product"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- 7. Express Headshot ----
          echo "--- 7/7: Express Headshot ---"
          P7_PROD=$(create_product "Express Headshot" "5 instant AI headshots from 1 selfie in 15 seconds" "express-instant")
          if [ "$P7_PROD" != "FAIL" ]; then
            echo "  Product: $P7_PROD"
            P7_PRICE=$(create_price "$P7_PROD" "1990" "Express Headshot - 5 instant AI headshots" "express-instant")
            if [ "$P7_PRICE" != "FAIL" ]; then
              echo "  Price: $P7_PRICE (1990 cents = 19.90 USD)"
            else
              echo "  FAILED to create price"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  FAILED to create product"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          echo ""

          # ---- Summary ----
          echo "========================================"
          echo "  SUMMARY"
          echo "========================================"
          echo ""
          echo "PADDLE_PRICE_HEADSHOTS_TAILORPIC1=${P1_PRICE:-FAIL}"
          echo "PADDLE_PRICE_HEADSHOTS_LITE=${P2_PRICE:-FAIL}"
          echo "PADDLE_PRICE_HEADSHOTS_EXPRESS=${P3_PRICE:-FAIL}"
          echo "PADDLE_PRICE_HEADSHOTS_STARTER=${P4_PRICE:-FAIL}"
          echo "PADDLE_PRICE_HEADSHOTS_PROFESSIONAL=${P5_PRICE:-FAIL}"
          echo "PADDLE_PRICE_HEADSHOTS_EXECUTIVE=${P6_PRICE:-FAIL}"
          echo "PADDLE_PRICE_EXPRESS_INSTANT=${P7_PRICE:-FAIL}"
          echo ""
          echo "Failed: $FAIL_COUNT / 7"

          # Write summary to GitHub Actions job summary
          {
            echo "## Paddle Product Setup Results"
            echo ""
            echo "| Package | Price ID |"
            echo "|---|---|"
            echo "| TailorPic 1 | ${P1_PRICE:-FAIL} |"
            echo "| Lite | ${P2_PRICE:-FAIL} |"
            echo "| Basic | ${P3_PRICE:-FAIL} |"
            echo "| Starter | ${P4_PRICE:-FAIL} |"
            echo "| Professional | ${P5_PRICE:-FAIL} |"
            echo "| Executive | ${P6_PRICE:-FAIL} |"
            echo "| Express Instant | ${P7_PRICE:-FAIL} |"
            echo ""
            echo "Failed: $FAIL_COUNT / 7"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL_COUNT" -gt 0 ]; then
            exit 1
          fi
