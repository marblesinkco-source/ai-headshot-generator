name: Paddle Product Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list-products
          - create-all
          - archive-price
      price_id:
        description: 'Price ID to archive (for archive-price action)'
        required: false
        type: string

jobs:
  paddle-setup:
    runs-on: ubuntu-latest
    steps:
      # ===== LIST PRODUCTS =====
      - name: List existing products
        if: inputs.action == 'list-products'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash {0}
        run: |
          echo "=== Listing Paddle Prices ==="
          PRICES=$(curl -s "https://api.paddle.com/prices?status=active" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json")
          echo "$PRICES" | python3 -m json.tool 2>/dev/null || echo "$PRICES"

          # Extract price IDs with package_id mapping
          SUMMARY=$(echo "$PRICES" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for p in data.get('data', []):
              pid = p.get('id','?')
              amt = p.get('unit_price',{}).get('amount','?')
              cd = p.get('custom_data',{}) or {}
              pkg = cd.get('package_id','no-package')
              desc = p.get('description','')
              print(f'{pkg} -> {pid} (amount: {amt}, desc: {desc})')
          " 2>/dev/null || echo "parse failed")

          echo ""
          echo "=== PRICE MAPPING ==="
          echo "$SUMMARY"

          # Post as commit comment
          SHA=$(gh api repos/${{ github.repository }} -q '.default_branch' 2>/dev/null)
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" -q '.sha' 2>/dev/null)
          if [ -n "$HEAD_SHA" ]; then
            gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/comments" \
              -f body="Paddle Prices:
          $SUMMARY" 2>/dev/null || echo "Comment post failed"
          fi

      # ===== ARCHIVE PRICE =====
      - name: Archive a price
        if: inputs.action == 'archive-price'
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          PRICE_ID="${{ inputs.price_id }}"
          if [ -z "$PRICE_ID" ]; then
            echo "ERROR: price_id is required for archive-price action"
            exit 1
          fi
          echo "Archiving price: $PRICE_ID"
          RESULT=$(curl -s -X PATCH "https://api.paddle.com/prices/$PRICE_ID" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "archived"}')
          echo "$RESULT" | python3 -m json.tool

      # ===== CREATE ALL =====
      - name: "Create: TailorPic 1 price (product exists)"
        if: inputs.action == 'create-all'
        id: tp1
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 1/7: TailorPic 1 (existing product) ---"
          RESP=$(curl -s -w "\n%{http_code}" -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"product_id":"pro_01m68s5dc6aqczq04cw6nfgxk1","description":"TailorPic 1 - 1 AI headshot","unit_price":{"amount":"699","currency_code":"USD"},"custom_data":{"package_id":"headshots-tailorpic1"}}')
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP: $HTTP"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          PRICE_ID=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ] && [ "$PRICE_ID" != "" ]; then
            echo "PRICE_TAILORPIC1=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_TAILORPIC1=FAIL_HTTP_$HTTP" >> "$GITHUB_ENV"
            echo "FAILED"
          fi

      - name: "Create: Lite product + price"
        if: inputs.action == 'create-all'
        id: lite
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 2/7: Lite ---"
          PROD_RESP=$(curl -s -X POST https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"Lite","description":"5 AI professional headshots","tax_category":"digital-goods","custom_data":{"package_id":"headshots-lite"}}')
          echo "Product response:"
          echo "$PROD_RESP" | python3 -m json.tool 2>/dev/null || echo "$PROD_RESP"
          PROD_ID=$(echo "$PROD_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -z "$PROD_ID" ]; then
            echo "PRICE_LITE=FAIL_PRODUCT" >> "$GITHUB_ENV"
            echo "Product creation failed"
            exit 0
          fi
          echo "Product: $PROD_ID"
          PRICE_RESP=$(curl -s -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"product_id\":\"$PROD_ID\",\"description\":\"Lite - 5 AI headshots\",\"unit_price\":{\"amount\":\"990\",\"currency_code\":\"USD\"},\"custom_data\":{\"package_id\":\"headshots-lite\"}}")
          echo "Price response:"
          echo "$PRICE_RESP" | python3 -m json.tool 2>/dev/null || echo "$PRICE_RESP"
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ]; then
            echo "PRICE_LITE=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_LITE=FAIL_PRICE" >> "$GITHUB_ENV"
          fi

      - name: "Create: Basic product + price"
        if: inputs.action == 'create-all'
        id: basic
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 3/7: Basic ---"
          PROD_RESP=$(curl -s -X POST https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"Basic","description":"10 AI professional headshots","tax_category":"digital-goods","custom_data":{"package_id":"headshots-express"}}')
          echo "Product response:"
          echo "$PROD_RESP" | python3 -m json.tool 2>/dev/null || echo "$PROD_RESP"
          PROD_ID=$(echo "$PROD_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -z "$PROD_ID" ]; then
            echo "PRICE_BASIC=FAIL_PRODUCT" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Product: $PROD_ID"
          PRICE_RESP=$(curl -s -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"product_id\":\"$PROD_ID\",\"description\":\"Basic - 10 AI headshots\",\"unit_price\":{\"amount\":\"1990\",\"currency_code\":\"USD\"},\"custom_data\":{\"package_id\":\"headshots-express\"}}")
          echo "Price response:"
          echo "$PRICE_RESP" | python3 -m json.tool 2>/dev/null || echo "$PRICE_RESP"
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ]; then
            echo "PRICE_BASIC=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_BASIC=FAIL_PRICE" >> "$GITHUB_ENV"
          fi

      - name: "Create: Starter product + price"
        if: inputs.action == 'create-all'
        id: starter
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 4/7: Starter ---"
          PROD_RESP=$(curl -s -X POST https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"Starter","description":"40 AI professional headshots","tax_category":"digital-goods","custom_data":{"package_id":"headshots-starter"}}')
          echo "Product response:"
          echo "$PROD_RESP" | python3 -m json.tool 2>/dev/null || echo "$PROD_RESP"
          PROD_ID=$(echo "$PROD_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -z "$PROD_ID" ]; then
            echo "PRICE_STARTER=FAIL_PRODUCT" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Product: $PROD_ID"
          PRICE_RESP=$(curl -s -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"product_id\":\"$PROD_ID\",\"description\":\"Starter - 40 AI headshots\",\"unit_price\":{\"amount\":\"2990\",\"currency_code\":\"USD\"},\"custom_data\":{\"package_id\":\"headshots-starter\"}}")
          echo "Price response:"
          echo "$PRICE_RESP" | python3 -m json.tool 2>/dev/null || echo "$PRICE_RESP"
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ]; then
            echo "PRICE_STARTER=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_STARTER=FAIL_PRICE" >> "$GITHUB_ENV"
          fi

      - name: "Create: Professional product + price"
        if: inputs.action == 'create-all'
        id: professional
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 5/7: Professional ---"
          PROD_RESP=$(curl -s -X POST https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"Professional","description":"80 AI professional headshots","tax_category":"digital-goods","custom_data":{"package_id":"headshots-professional"}}')
          echo "Product response:"
          echo "$PROD_RESP" | python3 -m json.tool 2>/dev/null || echo "$PROD_RESP"
          PROD_ID=$(echo "$PROD_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -z "$PROD_ID" ]; then
            echo "PRICE_PROFESSIONAL=FAIL_PRODUCT" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Product: $PROD_ID"
          PRICE_RESP=$(curl -s -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"product_id\":\"$PROD_ID\",\"description\":\"Professional - 80 AI headshots\",\"unit_price\":{\"amount\":\"4990\",\"currency_code\":\"USD\"},\"custom_data\":{\"package_id\":\"headshots-professional\"}}")
          echo "Price response:"
          echo "$PRICE_RESP" | python3 -m json.tool 2>/dev/null || echo "$PRICE_RESP"
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ]; then
            echo "PRICE_PROFESSIONAL=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_PROFESSIONAL=FAIL_PRICE" >> "$GITHUB_ENV"
          fi

      - name: "Create: Executive product + price"
        if: inputs.action == 'create-all'
        id: executive
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 6/7: Executive ---"
          PROD_RESP=$(curl -s -X POST https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"Executive","description":"160 AI professional headshots","tax_category":"digital-goods","custom_data":{"package_id":"headshots-executive"}}')
          echo "Product response:"
          echo "$PROD_RESP" | python3 -m json.tool 2>/dev/null || echo "$PROD_RESP"
          PROD_ID=$(echo "$PROD_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -z "$PROD_ID" ]; then
            echo "PRICE_EXECUTIVE=FAIL_PRODUCT" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Product: $PROD_ID"
          PRICE_RESP=$(curl -s -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"product_id\":\"$PROD_ID\",\"description\":\"Executive - 160 AI headshots\",\"unit_price\":{\"amount\":\"8990\",\"currency_code\":\"USD\"},\"custom_data\":{\"package_id\":\"headshots-executive\"}}")
          echo "Price response:"
          echo "$PRICE_RESP" | python3 -m json.tool 2>/dev/null || echo "$PRICE_RESP"
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ]; then
            echo "PRICE_EXECUTIVE=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_EXECUTIVE=FAIL_PRICE" >> "$GITHUB_ENV"
          fi

      - name: "Create: Express Headshot product + price"
        if: inputs.action == 'create-all'
        id: express
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        shell: bash {0}
        run: |
          echo "--- 7/7: Express Headshot ---"
          PROD_RESP=$(curl -s -X POST https://api.paddle.com/products \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"Express Headshot","description":"5 instant AI headshots from 1 selfie","tax_category":"digital-goods","custom_data":{"package_id":"express-instant"}}')
          echo "Product response:"
          echo "$PROD_RESP" | python3 -m json.tool 2>/dev/null || echo "$PROD_RESP"
          PROD_ID=$(echo "$PROD_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -z "$PROD_ID" ]; then
            echo "PRICE_EXPRESS=FAIL_PRODUCT" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Product: $PROD_ID"
          PRICE_RESP=$(curl -s -X POST https://api.paddle.com/prices \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"product_id\":\"$PROD_ID\",\"description\":\"Express Headshot - 5 instant headshots\",\"unit_price\":{\"amount\":\"1990\",\"currency_code\":\"USD\"},\"custom_data\":{\"package_id\":\"express-instant\"}}")
          echo "Price response:"
          echo "$PRICE_RESP" | python3 -m json.tool 2>/dev/null || echo "$PRICE_RESP"
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$PRICE_ID" ]; then
            echo "PRICE_EXPRESS=$PRICE_ID" >> "$GITHUB_ENV"
            echo "SUCCESS: $PRICE_ID"
          else
            echo "PRICE_EXPRESS=FAIL_PRICE" >> "$GITHUB_ENV"
          fi

      - name: "Summary: all price IDs"
        if: inputs.action == 'create-all'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash {0}
        run: |
          SUMMARY="PADDLE_PRICE_HEADSHOTS_TAILORPIC1=${PRICE_TAILORPIC1:-UNKNOWN}
          PADDLE_PRICE_HEADSHOTS_LITE=${PRICE_LITE:-UNKNOWN}
          PADDLE_PRICE_HEADSHOTS_EXPRESS=${PRICE_BASIC:-UNKNOWN}
          PADDLE_PRICE_HEADSHOTS_STARTER=${PRICE_STARTER:-UNKNOWN}
          PADDLE_PRICE_HEADSHOTS_PROFESSIONAL=${PRICE_PROFESSIONAL:-UNKNOWN}
          PADDLE_PRICE_HEADSHOTS_EXECUTIVE=${PRICE_EXECUTIVE:-UNKNOWN}
          PADDLE_PRICE_EXPRESS_INSTANT=${PRICE_EXPRESS:-UNKNOWN}"

          echo "========================================"
          echo "  ALL PRICE IDs"
          echo "========================================"
          echo "$SUMMARY"

          # Post as commit comment
          COMMIT_SHA="${{ github.sha }}"
          gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/comments" \
            -f body="$SUMMARY" 2>/dev/null || true

          # Write to step summary
          {
            echo "## Paddle Setup Results"
            echo '```'
            echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
