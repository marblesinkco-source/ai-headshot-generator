name: Supabase keep-alive

# Prevents Supabase Hobby-plan project from being paused due to inactivity.
# Hits the /api/cron/keep-alive endpoint every 6 hours via the live site.

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase via keep-alive endpoint
        run: |
          RESPONSE=$(curl -sf -w "\n%{http_code}" \
            "https://www.tailorpic.com/api/cron/keep-alive" \
            --max-time 30 2>&1) || true

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Supabase ping successful"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "⚠️ Auth required — endpoint works but needs CRON_SECRET"
            echo "Supabase is still pinged by the daily Vercel crons"
          else
            echo "⚠️ Ping returned $HTTP_CODE — Supabase may still be active via Vercel crons"
          fi
